<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Getting Started: Serving Web Content</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container">
		<div class="row">
				<div class="col-6 col-sm-4">
		<h1>Mantenimiento de Productos</h1>
		<form action="/productos/grabar" method="post" th:object="${producto}">
			
			<div class="form-group">
				<label for="inputCod">Código</label> 
				<input type="text" 
					class="form-control" id="inputCod" th:field="*{id_prod}" placeholder="Código">
			</div>
			<div class="form-group">
				<label for="inputNom">Nombre</label> 
				<input type="text" 
					class="form-control" id="inputNom"
					th:field="*{des_prod}"
					placeholder="Nombre" name="des_prod">
			</div>
			<div class="form-row">
				<div class="form-group col-md-6">
					<label for="inputStk">Stock</label> 
					<input type="number" 
						class="form-control"
						th:field="*{stk_prod}"
						name="stk_prod" id="inputStk" placeholder="0">
				</div>
				<div class="form-group col-md-6">
					<label for="inputPrec">Precio</label> 
					<input type="number" step="0.01"  
						class="form-control"
						th:field="*{pre_prod}"
						id="inputPrec" name="pre_prod" placeholder="0.00">
				</div>
			</div>
			<div class="form-row">
				<div class="form-group col-md-4">
				    <label for="inputCat">Categoría</label> 
				    <select id="inputCat"
							class="form-control" name="idcategoria">
				        <option value="">Seleccione...</option>
				        <option th:each="c : ${lstCategorias}" 
				                th:value="${c.idcategoria}"
				                th:text="${c.descripcion}"></option>						
				    </select>
				</div>
				<div class="form-group col-md-4">
					<label for="inputEstado">Estado</label> 
					<select id="inputEstado" class="form-control" name="est_prod" >
						<option value="-1">Seleccione...</option>
						<option value="1">Activo</option>
						<option value="0">Eliminado</option>
					</select>
				</div>
				<div class="form-group col-md-4">
					<label for="inputProv">Proveedor</label> 
					<select id="inputProv" class="form-control" name="idproveedor">
						<option value="-1">Seleccione...</option>
						<option th:each="pv : ${lstProveedores}" 
				                th:value="${pv.idproveedor}"
				                th:text="${pv.nombre_rs}">
				        </option>	
					</select>
				</div>
			</div>
			
			<button type="submit" class="btn btn-primary">Registrar</button>
		</form>
		<div th:text="${mensaje}"></div>
	</div>
	<div class="col-6 col-sm-7">
				<h3></h3>
				<table class="table">
					<thead>
						<tr>
							<th>Imagen</th>
							<th>Producto</th>
							<th>Stock</th>
							<th>Precio</th>
							<th>Estado</th>
							<th>Categoria</th>
							<th>Acciones</th>
							<!--<th>Proveedor</th>-->
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${lstProductos}">
							<!--<th th:text="${p.id_prod}" scope="row"></th>-->
							<th><img style="height: 100px;" th:src="@{/img/productos/} + ${p.id_prod} + @{.png}"></th>
							<td th:text="${p.des_prod}"></td>
							<td th:text="${p.stk_prod}"></td>
							<td th:text="'S/. ' + ${p.pre_prod}"></td>
							<td th:text="${p.est_prod}"></td>
							<td th:text="${p.categoria.descripcion}"></td>
							<!--<td th:text="${p.idproveedor}"></td>-->
							<td><a th:href="@{/productos/editar/}+${p.id_prod}"
									class="btn btn-success">Editar</a></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" ></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" ></script>
</html>
